[tox]
envlist = py312,lint,type

[testenv]
deps =
    pytest
    pytest-cov
    pdfplumber
    pytesseract
    pdf2image
    pandas
    openpyxl
    python-dotenv

commands =
    pytest {posargs:tests/}

[testenv:lint]
deps =
    flake8
    flake8-docstrings
    pylint

commands =
    flake8 .
    pylint *.py

[testenv:type]
deps =
    mypy
    types-PyPDF2

commands =
    mypy . --ignore-missing-imports

[testenv:format]
deps =
    black
    isort

commands =
    black --check .
    isort --check-only .

[testenv:cov]
deps =
    {[testenv]deps}
    pytest-cov

commands =
    pytest --cov=. --cov-report=html --cov-report=term {posargs:tests/}

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[flake8]
max-line-length = 88
exclude = .git,__pycache__,.venv,venv
ignore = E203,W503
