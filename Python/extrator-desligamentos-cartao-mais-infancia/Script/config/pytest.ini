[pytest]
# Configuração do pytest

# Diretório de testes
testpaths = tests

# Padrão de nomes de arquivo de teste
python_files = test_*.py

# Padrão de nomes de classe de teste
python_classes = Test*

# Padrão de nomes de função de teste
python_functions = test_*

# Mostrar output do print durante testes
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers customizados
markers =
    unit: Testes unitários
    integration: Testes de integração
    slow: Testes lentos
